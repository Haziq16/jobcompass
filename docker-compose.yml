services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobcompass
      POSTGRES_PASSWORD: local_jobcompass
      POSTGRES_DB: jobcompass
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["jobcompass_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobcompass"]
      interval: 5s
      retries: 10
volumes:
  jobcompass_data:
