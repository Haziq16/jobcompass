name: Refresh job catalogue
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalogue-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # Catalogue polling needs no checkout or database access; browser dependencies load only for an authorised pending task.
      - name: Check for authorised offline applications
        id: automatic
        env:
          AUTOMATION_APP_URL: ${{ vars.AUTOMATION_APP_URL }}
          AUTOMATION_WORKER_SECRET: ${{ secrets.AUTOMATION_WORKER_SECRET }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const secret=process.env.AUTOMATION_WORKER_SECRET||'';
          if(secret.length<32){appendFileSync(process.env.GITHUB_OUTPUT,'pending=false\n');process.exit(0);}
          const url=new URL(process.env.AUTOMATION_APP_URL||'');
          if(url.origin!=='https://jobcompass-haze-6576.vercel.app'||url.pathname!=='/'||url.search)throw new Error('Unexpected automation workspace');
          const response=await fetch(url.origin+'/api/automation-worker/pending',{headers:{Authorization:'Bearer '+secret},redirect:'error',signal:AbortSignal.timeout(45000)});
          if(!response.ok)throw new Error('Worker availability check failed: '+response.status);
          appendFileSync(process.env.GITHUB_OUTPUT,'pending='+String((await response.json()).pending===true)+'\n');
          NODE
      - name: Check out the reviewed application worker
        if: steps.automatic.outputs.pending == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node for the application worker
        if: steps.automatic.outputs.pending == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
      - name: Install worker dependencies
        if: steps.automatic.outputs.pending == 'true'
        run: npm ci --ignore-scripts
      - name: Locate a browser for the application worker
        if: steps.automatic.outputs.pending == 'true'
        shell: bash
        run: |
          if command -v google-chrome >/dev/null; then
            printf 'CHROME_EXECUTABLE_PATH=%s\n' "$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright-core install --with-deps chromium
          fi
      - name: Process one authorised application
        if: steps.automatic.outputs.pending == 'true'
        timeout-minutes: 4
        env:
          AUTOMATION_APP_URL: ${{ vars.AUTOMATION_APP_URL }}
          AUTOMATION_WORKER_SECRET: ${{ secrets.AUTOMATION_WORKER_SECRET }}
          AUTOMATION_ALLOW_SUBMIT: "true"
        run: node scripts/automation-worker.mjs

      - name: Check employer feeds
        if: always()
        env:
          CATALOG_REFRESH_URL: ${{ vars.CATALOG_REFRESH_URL }}
          CATALOG_REFRESH_SECRET: ${{ secrets.CATALOG_REFRESH_SECRET }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = new URL(process.env.CATALOG_REFRESH_URL || '');
          const secret = process.env.CATALOG_REFRESH_SECRET || '';
          if (url.protocol !== 'https:' || url.pathname !== '/api/catalog/refresh' || url.search || url.username || url.password || secret.length < 32) throw new Error('Invalid catalogue scheduler configuration');
          const response = await fetch(url, {headers: {Authorization: `Bearer ${secret}`}, redirect: 'error', signal: AbortSignal.timeout(180000)});
          if (!response.ok) throw new Error(`Catalogue refresh HTTP ${response.status}`);
          const result = await response.json();
          console.log(JSON.stringify({status: result.status, checked: result.checked, succeeded: result.succeeded, failed: result.failed}));
          if (result.status === 'completed' && result.checked > 0 && result.succeeded === 0) throw new Error('No employer feed could be refreshed');
          // A separate six-hour lease bounds candidate admission. No new subscription,
          // third-party job-data API or extra scheduled runner is provisioned.
          url.searchParams.set('mode', 'expand');
          const growth = await fetch(url, {headers: {Authorization: `Bearer ${secret}`}, redirect: 'error', signal: AbortSignal.timeout(180000)});
          if (!growth.ok) throw new Error(`Catalogue expansion HTTP ${growth.status}`);
          console.log(JSON.stringify(await growth.json()));
          NODE
