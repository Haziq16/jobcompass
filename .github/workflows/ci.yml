name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jobcompass
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: jobcompass
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U jobcompass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jobcompass:ci-only-password@127.0.0.1:54329/jobcompass?schema=public
      APP_ACCESS: local
      ENABLE_AI: "false"
      PUBLIC_SIGNUP: "false"
      JSEARCH_API_KEY: ""
      AI_GATEWAY_API_KEY: ""
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Create non-secret local configuration
        run: cp .env.example .env
      - run: npm run db:generate
      - run: npm run check:secrets
      - run: npm run lint
      - run: npm test
      - run: npm run test:migration
      - run: npm run build
      - run: npm run typecheck
